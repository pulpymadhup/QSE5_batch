<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            background-color: #fdfbf5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        main {
            margin: 1rem;
            padding: 1rem;
            border: 1px solid black;
        }

        .nav {
            display: flex;
            flex-flow: wrap row;
            align-content: center;
            gap: 40rem;
            align-items: center;
            font-size: larger;
            padding: 10px 15px;
        }
        .nav .nav-right{
            display: flex;
            flex-flow: wrap row;
            align-content: center;
            gap: 2rem;
            align-items: center;
        }
        .nav .nav-right button{
            background-color: black;
            color: white;
            border-radius: 10px;
            border: none;
            height: 30px;
            width: 80px;
        }
        .nav .nav-right button:hover{
            background-color: white;
            color: black;
            border-radius: 10px;
            border: 1px black solid;
            height: 30px;
            width: 80px;
        }
        .nav .nav-right .item-1:hover{
            text-decoration: underline;
        }
        .nav .nav-right .item-2:hover{
            text-decoration: underline;
        }
        .nav .nav-right .item-3:hover{
            text-decoration: underline;
        }
        .nav .nav-right .item-4:hover{
            text-decoration: underline;
        }
        .nav .nav-right .item-5:hover{
            text-decoration: underline;
        }

    </style>
</head>

<body>
    <main>
        <div class="nav">
            <div class="nav-left"> <img
                    src="https://cdn.prod.website-files.com/63661389dd2417f19a0d89d3/636a2cb5715eea61d64a3119_logo.svg"
                    alt="">
            </div>
            <div class="nav-right">
                <div class="item-1">Services</div>
                <div class="item-2">Work</div>
                <div class="item-3">Studio</div>
                <div class="item-4">Pages</div>
                <div class="item-5">Cart</div>
                <div class="item-6"><button> LET'S TALK</button></div>
                
            </div>

        </div>
        <br>
        <br>
        <hr>
        <br>
        <br>
        <div class="hero">
            <div class="hero-right"></div>
        </div>

    </main>
</body>

</html>
