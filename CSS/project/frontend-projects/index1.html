<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            background-color: #fdfbf5;
            font-family:  Roboto Mono, sans-serif;
        }

        main {
            margin: 1rem;
            padding: 1rem;
            border: 1px solid black;
        }

        .nav {
            display: flex;
            flex-flow: wrap row;
            align-content: center;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            font-size: larger;
            padding: 10px 15px;
        }
        .nav .nav-right{
            display: flex;
            flex-flow: wrap row;
            align-content: center;
            gap: 2rem;
            align-items: center;
        }
        .nav .nav-right .item-6 button{
            background-color: black;
            color: #fdfbf5;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            height: 2.5rem;
            width: 7rem;
        }
        .nav .nav-right .item-6 button:hover{
            background-color: #fdfbf5;
            color: black;
            border-radius: 10px;
            border: 1px black solid;
            font-weight: bold;
            height: 2.5rem;
            width: 7rem;
        }.nav .nav-right .item-7{
            align-self: stretch;
            /* width: 1px; */
            border-right: 1px solid #191919;
        }
        .nav .nav-right .item-1:hover,
        .nav .nav-right .item-2:hover,
        .nav .nav-right .item-3:hover,
        .nav .nav-right .item-4:hover,
        .nav .nav-right .item-5:hover{
            text-decoration: underline;
        }
        
        .nav .nav-right .item-8 button,
        .nav .nav-right .item-9 button{
            background-color: #fdfbf5;
            color: black;
            border-radius: 50%;
            border: 1px solid gray;
            font-weight: bold;
            height: 3rem;
            width: 3rem;
        }
        .nav .nav-right .item-8 button:hover,
        .nav .nav-right .item-9 button:hover{
            background-color: black;
            color: #fdfbf5;
            border-radius: 50%;
            border: 1px gray solid;
            font-weight: bold;
            height: 3rem;
            width: 3rem;
        }

        /* hero section  */

        .hero{
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            padding: 10px;
            justify-content: space-between;
        }
        .hero .hero-left,
        .hero .hero-left{
            display: flex;
            flex-flow: column wrap;
            gap: 10px;
            flex: 1;
        }
        .hero .hero-left .heading{
            width: 100%;
            font-size: 5rem;
            font-family: Syne,sans-serif;
            line-height: 100%;

        }
        .hero .hero-left .description{
            width: 100%;
            font-size: 1.25rem;
            line-height: 150%;
        }
        .hero .hero-right video{
            width: 100%;
            border-radius: 20px;
        }

    </style>
</head>

<body>
    <main>
        <div class="nav">
            <div class="nav-left"> <img
                    src="https://cdn.prod.website-files.com/63661389dd2417f19a0d89d3/636a2cb5715eea61d64a3119_logo.svg"
                    alt="">
            </div>
            <div class="nav-right">
                <div class="item-1">Services</div>
                <div class="item-2">Work</div>
                <div class="item-3">Studio</div>
                <div class="item-4">Pages</div>
                <div class="item-5">Cart</div>
                <div class="item-6"><button> LET'S TALK</button></div>
                <div class="item-7"></div>
                <div class="item-8"><button>TW</button></div>
                <div class="item-9"><button>SW</button></div>
            </div>

        </div>
        <br>
        <br>
        <hr>
        <br>
        <br>
        <div class="hero">
            <div class="hero-left">
                <div class="heading">We are a digital agency from Lisbon.</div>
                <div class="description">Elevating brands through creative digital solutions, proudly representing Lisbon's vibrant innovation.</div>
            </div>
            <div class="hero-right">
                <video src="https://www.pexels.com/download/video/18069234/" alt="" height="400" muted autoplay loop>
            </div>
        </div>
        <br>
        <br>
        <hr>

    </main>
</body>

</html>
