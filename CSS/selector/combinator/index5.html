<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Examples -->
    <style>
        ol ul li{
            background-color: aqua;
        }
        ol > li{
            background-color: chocolate;
        }
        ol+h1{
            background-color: brown;
        }
        ol~h1{
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <ol>
        <li>list1</li>
        <li>list2</li>
        <ul>
            <li>Nested list</li>
            <li>Nested list</li>
            <li>Nested list</li>
        </ul>
        <li>List1</li>
        <li>list1</li>
    </ol>
    <h1>hello</h1>
    <h1>Bye</h1>
</body>
</html>
