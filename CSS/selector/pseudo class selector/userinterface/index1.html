<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- userInterface -->
    <style>
        input:enabled{
            background-color: beige;
        }
        input:disabled{
            background-color: red;
        }
        input:checked{
            background-color: blue;
            outline: solid 5px brown;
        }
    </style>
</head>
<body>
    <input type="text" disabled>
    <input type="text">
    <input type="checkbox">
    <input type="radio">
</body>
</html>
