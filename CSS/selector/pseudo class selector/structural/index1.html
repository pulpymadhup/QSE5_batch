<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            color: green;
        }
        ul li:last-child{
            color: blue;
        }
        ul li:nth-child(2){
            background-color: blue;
        }
        ul  li:nth-child(3){
            background-color: violet;
        }
        ul li:nth-child(even){
            color: red;
        }
        ul li:nth-child(odd){
            color: brown;
        }
        ul li:nth-last-child(2){
            background-color: blue;
        }
        ul li:nth-last-child(even){
            background-color: aqua;
        }
    </style>
</head>
<body>
   <ul>
    <li>Shubham</li>
    <li>Ajit</li>
    <li>Abhijit</li>
    <li>Ashwin</li>
    <li>wazid</li>
    <li>Lopa</li>
    <li>Abhinav</li>
    <li>Krishna</li>
   </ul> 
</body>
</html>
