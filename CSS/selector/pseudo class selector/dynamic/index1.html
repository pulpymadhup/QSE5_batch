<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:visited{
            color: chocolate;
        }
        a:active{
            background-color: black;
            color: chartreuse;
        }
        a:link{
            
            color: purple;
        }
        a:hover{
            background-color: hotpink;
            color: white;
        }
        h1:hover{
            background-color: black;
            color: white;
        }
        input:focus{
            background-color: chocolate;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Pseudo Class Selector</h1>
    <a href="https://www.foxtale.com">Foxtale</a>
    <a href="https://www.nykaa.com">Nykaa</a>
    <a href="https://www.purple.com">Purple</a>

    <input type="text">
</body>
</html>
