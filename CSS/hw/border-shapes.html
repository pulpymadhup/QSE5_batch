<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
        }

        .square {
            text-align: justify;
            padding: 30px;
            height: 150px;
            width: 150px;
            margin: 100px auto;
            background-color: black;
            border: solid 10px;
        }

        .rectangle {
            text-align: justify;
            padding: 30px;
            height: 150px;
            width: 350px;
            margin: 100px auto;
            background-color: black;
            border: solid 10px;
        }

        .circle {
            text-align: justify;
            padding: 30px;
            height: 150px;
            width: 150px;
            margin: 100px auto;
            background-color: black;
            border: solid 10px;
            border-radius: 50%;
        }

        .oval {
            text-align: justify;
            padding: 30px;
            height: 150px;
            width: 350px;
            margin: 100px auto;
            background-color: black;
            border: solid 10px;
            border-radius: 50%;
        }

        .equal-traingle {
            text-align: justify;
            padding: 0px;
            margin: 70px auto;
            width: 0;
            height: 75px;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 120px solid black;
        }

        .l-right-triangle{
            text-align: justify;
            padding: 0px;
            margin: 70px auto;
            width: 0;
            border-top: 300px solid transparent;
            border-left: 200px solid black;
        }

        .r-right-triangle{
            text-align: justify;
            padding: 0px;
            margin: 70px auto;
            width: 0;
            border-top: 300px solid transparent;
            border-right: 200px solid black;
        }
        .inverse-equal-traingle{
            text-align: justify;
            padding: 0px;
            margin: 70px auto;
            width: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-top: 120px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="square"></div>
        <div class="rectangle"></div>
        <div class="circle"></div>
        <div class="oval"></div>
        <div class="equal-traingle"></div>
        <div class="l-right-triangle"></div>
        <div class="r-right-triangle"></div>
        <div class="inverse-equal-traingle"></div>
    </div>

</body>

</html>
