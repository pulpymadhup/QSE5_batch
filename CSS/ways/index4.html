<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- we can priotise the internal css over inline css by using !important -->
    <style>
        h1{
            background-color: red !important;
        }
    </style>
</head>
<body>
     <!-- priority is given to inline css in between inine and internal -->
    <h1 style="background-color: aqua;">hello CSS</h1>
</body>
</html>
