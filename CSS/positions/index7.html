<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <!-- z-index  -->
     <style>
        div{
            height: 250px;
            width: 250px;
            box-shadow: 3px 3px 4px gray;
        }
        .div-1{
            background-color: lightblue;
            position: absolute;
            z-index: 10;
            left: 90px;
            top: 90px;
        }
        .div-2{
           background-color: lightsalmon;
           position: absolute;
           z-index: 9;
           left: 70px;
           top: 70px; 
        }
        .div-3{
            background-color: lightgreen;
            position: absolute;
            z-index: 1;
            left: 30px;
            top: 30px;
        }
        .div-4{
            background-color: lightblue;
            position: absolute;
            z-index: 8;
            left: 50px;
            top: 50px;
        }

     </style>
</head>
<body>
    <div class="div-1"></div>
    <div class="div-2"></div>
    <div class="div-3"></div>
    <div class="div-4"></div>
</body>
</html>
