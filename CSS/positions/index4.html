<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* what is position absolute ?
        it will take the reference from the nearest positioned ansistor . */
        
        /* Position : absolute */
        section{
            height: 300px;
            width: 300px;
            background-color: violet;
            margin: 100px;
            padding: 50px;
            position: relative;
        }
        main{
            height: 200px;
            width: 200px;
            background-color: red;
            padding: 50px;
            /* position: absolute; */
        }
        div{
            height: 150px;
            width: 150px;
            background-color: blue;
            padding: 20px;
            position:absolute;
            left: 0px;
            top:0px
        }
    </style>
</head>

<body>
    <section>
        <main>
            <div></div>
        </main>
    </section>
    
</body>

</html>
