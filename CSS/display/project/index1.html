<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: "Amazon Ember", Arial, sans-serif;;
        }
        .card{
            margin: 100px auto;
            width: 240px;
            border: 1px solid none;
            border-radius: 10px;
            /* background-color: red; */
            /* box-shadow: 5px 5px 2px gray; */
        }
        img{
            width: 240px;
            overflow: hidden;
        }
        .container-bottom{
            padding: 0px 10px;
        }
        .container{
            display: block;
            padding: 5px 0px;
        }
        .container-1{
            font-size: smaller;
            padding: 10px 0px;
        }
        a{
            color: lightskyblue;
        }
        .container-2{
            font-size: larger;
            padding: 20px 0px 0px;
        }
        .container-3{
            font-size: medium;
            color: gray;
        }
        .container-5{
            font-size: medium;
            color: gray;
        }
        sup{
            font-weight: bolder;
        }
        del{
            font-size: small;
        }
        .container-6{
            font-weight: 100;
            font-size: x-large;
        }
        h6{
            display: inline-block;
            height: 10px;
            top: 0;
        }
        button{
            outline: none;
            border: none ;
            width: 100px;
            border-radius: 5px;
            padding: 10px;
            margin: 10px auto;
            font-weight: bolder;
        }
        .add{
            background-color: #FFF83F;
            color: black;
        }

        .buy{
            background-color: #FFF83F;
            color: black;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="container-top">
            <img src="https://m.media-amazon.com/images/I/81shujWrB3L._AC_UL480_FMwebp_QL65_.jpg" alt="">
        </div>
        <div class="container-bottom">
            <span class="container container-1"><a href="">+6 other colors/patterns</a></span>
            <span class="container container-2">Skechers Men's Go Run Consistent 2.0 Empowered</span>
            <span class="container container-3">Hands Free Slip-Ins, Air-Cooled...</span>
            <span class="container container-4">4.0 ⭐⭐⭐⭐(2.5k)</span>
            <span class="container container-5">50+ bought in past month</span>
            <span class="container container-6"> <h6>INR</h6>7,180 <del>List:INR8,900.25</del> </span>
            <span class="container container-7">Delivery <strong>Mon, Nov 30</strong> </span>
            <div><button class="add">Add to kart</button><button class="buy">Buy</button></div>
        </div>
    </div>
</body>
</html>
