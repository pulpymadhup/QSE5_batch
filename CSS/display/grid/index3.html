<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;

        }
         .items{
            background-color: lightgreen;
            border: solid 1px black ;
        }
        .item-2{
            grid-column: 2/4;
        }
        .item-3{
            grid-row: 2/4;
        }
        .item-6{
            grid-column: 2/4;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">item1</div>
        <div class="items item-2">item2</div>
        <div class="items item-3">item3</div>
        <div class="items item-4">item4</div>
        <div class="items item-5">item5</div>
        <div class="items item-6">item6</div>
    </div>
</body>
</html>
