<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4 , 200px);
            gap: 10px;
        }
        .items{
            background-color: lightcoral;
            /* height: 200px;
            width: 200px; */
            color: white;
        }
        .item-1{
            grid-column: 1/5;
        }
        .item-20{
            grid-column: 3/5;
        }
    </style>
</head>
<body>
    <h1>calculator</h1>
    <div class="container">
        <div class="items item-1"></div>
        <div class="items item-2">C</div>
        <div class="items item-3">X</div>
        <div class="items item-4">%</div>
        <div class="items item-5">*</div>
        <div class="items item-6">7</div>
        <div class="items item-7">8</div>
        <div class="items item-8">9</div>
        <div class="items item-9">/</div>
        <div class="items item-10">4</div>
        <div class="items item-11">5</div>
        <div class="items item-12">6</div>
        <div class="items item-13">+</div>
        <div class="items item-14">1</div>
        <div class="items item-15">2</div>
        <div class="items item-16">3</div>
        <div class="items item-17">-</div>
        <div class="items item-18">0</div>
        <div class="items item-19">.</div>
        <div class="items item-20">=</div>
    </div>
</body>
</html>
