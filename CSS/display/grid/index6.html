<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4 , 200px);
            gap: 10px;
        }
        .items{
            background-color: lightcoral;
            /* height: 200px;
            width: 200px; */
            color: white;
        }
        .item-1{
            grid-row: 1/4;
        }
        .item-2{
            grid-row: 1/2;
            grid-column: 2/4;
        }
        .item-3{
            grid-row: 2/3;
            grid-column: 2/3;
        }
        .item-4{
            grid-row: 2/3;
            grid-column: 3/4;
        }
        .item-3{
            grid-row: 2/3;
            grid-column: 2/3;
        }
        .item-6{
            grid-column: 4/5;
            grid-row: 2/4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">item-1</div>
        <div class="items item-2">item-2</div>
        <div class="items item-3">item-3</div>
        <div class="items item-4">item-4</div>
        <div class="items item-5">item-5</div>
        <div class="items item-6">item-6</div>
        <div class="items item-7">item-7</div>
        <div class="items item-8">item-8</div>
    </div>
</body>
</html>
