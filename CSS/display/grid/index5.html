    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(6 , 1fr);
            grid-auto-rows: 10px;
            gap: 20px;
        }
        .items{
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
        }
        .items img{
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;      
                  
        }
        .item-1{
            grid-row: 1/10;
        }
        .item-2{
            grid-row: 1/7;
        }
        .item-3{
            grid-row: 1/12;
        }
        .item-4{
            grid-row: 1/12;
        }
        .item-5{
            grid-row: 1/12;
        }
        .item-6{
            grid-row: 1/8;
        }
        .item-7{
            grid-row: 10/19;
        }
        .item-8{
            grid-row: 7/17;
        }
        .item-9{
            grid-row: 12/20;
        }
        .item-10{
            grid-row: 12/18;
        }
        .item-11{
            grid-row: 12/15;
        }.item-12{
            grid-row: 8/25;
        }.item-13{
            grid-row: 19/25;
        }.item-14{
            grid-row: 17/25;
        }.item-15{
            grid-row: 20/25;
        }.item-16{
            grid-row: 18/25;
        }.item-17{
            grid-row: 15/25;
        }

    </style>
</head>
