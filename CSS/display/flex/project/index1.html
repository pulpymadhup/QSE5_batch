<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            height: 100vh;
            /* border: 2px solid black; */
            flex-flow: row wrap;
            gap: 20px;
            padding: 20px;
            justify-content: center;
            align-content: end;
        }

            height: 200px;
            overflow: hidden;
            border-radius: 10px;
        }
        .items{
            display: flex;
            flex-flow: column wrap;
            
        }
        span{

        }
        .price{

        }

    </style>
</head>
