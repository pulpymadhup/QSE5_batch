<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i = 0 ; i<5 ; i++){
            for(let j = parseInt(5/2) - i + 1 ; j>=0 ; j++){
                process.stdout.write(" - ");
            } 
            for(let k = 1 ; k<= 2*i +1 ; k++){
                process.stdout.write(" * ");
            }
            for(let j = parseInt(5/2) - i + 1 ; j>=0 ; j++){
                process.stdout.write(" - ");
            }
        }
    </script>
</body>
</html>
