<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <label for="">First Name:</label>
        <input type="text" name="firstname" pattern="[a-zA-Z ]{3,15}" autofocus required><br><br>
        <label for="">Last Name:</label>
        <input type="text" name="lastname" minlength="3" maxlength="10"><br><br>
        <label for="">Email:</label>
        <input type="emal" name="email"> <br><br>
        <label for="">Age Limit</label>
        <input type="number" name="agelimit" min="18" max="42" step="2"><br><br>
        <label for="">Phone number</label>
        <input type="tel" name="phonenumber"><br><br>

        <label for="">Gender :</label>
        <input type="radio" value="Male" name="gen" disabled >
        <label for="">Male</label>
        <input type="radio" value="Female" name="gen" checked>
        <label for="">Female</label>
        <input type="radio" value="Others" name="gen">
        <label for="">others</label><br><br>

        <label for="">Programming language: </label>
        <input type="checkbox" value="JS" name="lang" disabled>
        <label for="">JS</label>
        <input type="checkbox" value="java" name="lang">
        <label for="">Java</label>
        <input type="checkbox" value="Python" name="lang" checked>
        <label for="">Python</label><br><br>

        <label for="">Resume :</label>
        <!-- <input type="file" accept=".pdf"> -->
         <input type="file" accept="image/*,audio/*,video/* multiple"><br><br>

        <input type="submit">
    </form>
</body>

</html>
