<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table align="center" width="600" cellspacing="20" bgColor="pink">
        <caption>Student Registration form</caption>
        <thead>
            <tr>
                <td>
                    <label for="">Roll no:</label>
                </td>
                <td>
                    <input type="number">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Student Name</label>
                </td>
                <td>
                    <input type="text" placeholder="First Name"> -
                    <input type="text" placeholder="Last Name">
                </td>

            </tr>
            <tr>
                <td>
                    <label for="">Father's Name</label>
                </td>
                <td>
                    <input type="text">
                </td>
                
            </tr>
            <tr>
                <td><label for="">Date of Birth: </label></td>
                <td>
                    <input type="date"> (DD-MM-YYYY)
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Mobile No:</label>
                </td>
                <td>
                    <input type="text" value="+91" readonly size="1">
                    <input type="tel">
                </td>

            </tr>
            <tr>
                <td>
                    <label for="">Email Id:</label>
                </td>
                <td>
                    <input type="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Password</label>

                </td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender: </label>

                </td>
                <td>
                    <input type="radio" value="Male" name="gen">
                    <label for="">Male</label>
                    <input type="radio" value="Female" name="gen">
                    <label for="">Female</label>
                    <input type="radio" value="Others" name="gen">
                    <label for="">others</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Programming Languages: </label>
                </td>
                <td>
                    <input type="checkbox" value="java">
                    <label for="">Java</label>
                    <input type="checkbox" value="js">
                    <label for="">Js</label>
                    <input type="checkbox" value="Python">
                    <label for="">Python</label>
                </td>
            </tr>
            <tr>
                <td><label for="">Courses:</label></td>
                <td>
                    <select name="" id="">
                        <option value="CSE" disabled selected>---Select Courses---</option>
                        <option value="CSE">CSE</option>
                        <option value="Mech">Mech</option>
                        <option value="Civil">Civil</option>
                    </select>

                </td>
            </tr>
            <tr>
                <td>
                    <label for="">City:</label>
                </td>
                <td>
                    <input type="file">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">City:</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Address:</label>
                </td>
                <td>
                    <textarea name="" id="" rows="7" cols="29"></textarea>
                </td>
            </tr>
            <tr>
                <th colspan="2">
                    <input type="submit" value="log-IN">
                    <input type="reset">
                </th>
            </tr>

        </thead>
    </table>
</body>

</html>
