<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <main>
        <div class="Announcement-bar">

            <marquee bgColor="purple" direction="left" height="40" scrollAmount="10">Free Delivery on orders above
                &#8377; 499 </marquee>

        </div>
        <div class="Navbar">
            <i class="fa-mosaic fa-solid fa-inbox fa-wag fa-2xl " style="color: rgb(177, 151, 252);"></i>
            <Span>Home</Span>
            <span>Products</span>
            <span>Categories</span>
            <Span>About</Span>
            <input type="search" placeholder="Search here ">
            <button>Search</button>
            <i class="fa-solid fa-cart-shopping fa-2xl" style="color: rgb(177, 151, 252);"></i>
        </div>
        <div class="Hero-section">
            <div class="hero-content">
                <div class="text-content">
                    <p>
                        subtitle
                    </p>
                    <h1>
                        upgrade your Everyday
                    </h1>
                    <p>
                        Explore premium gadgets at unbeatable prices.
                    </p>
                    <button>Explore</button>
                </div>
                <div class="product-image">
                    <img src="https://w7.pngwing.com/pngs/882/409/png-transparent-smart-watch-thumbnail.png"
                        alt="error">
                </div>
            </div>
            <div class="slider-control">
                <div class="slider-dots">
                    <span class="plagnation-dot active"></span>
                    <span class="plagnation-dot"></span>
                    <span class="plagnation-dot"></span>
                    <span class="plagnation-dot"></span>
                    <span class="plagnation-dot"></span>
                </div>

                <i class="fa-solid fa-arrow-left-long fa-lg" style="color:white"></i>
                <i class="fa-solid fa-arrow-right-long fa-lg " style="color:white"></i>
            </div>
        </div>
    </main>

</body>

</html>
