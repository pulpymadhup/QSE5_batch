<body>
    <script>
        // Arrow function 
        let name = prompt("Give your name :");
        console.log("function starts")
        let greetMessage = (a) => {
            console.log(`Welcome ${a} , this is arrow function .`)
        }
        greetMessage(name)
        console.log("function ends")
    </script>
