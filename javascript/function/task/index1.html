        let num1 = Number(prompt("Give number 1 : "))
        let num2 = Number(prompt("Give number 2 : "))
        let operator = prompt("Choose operator : " , "+")
        let greetUser = function(a,b,c) {
            if(c == "+"){
                console.log(`Addition of ${a} and ${b} is ${a+b} .`)
            }
            else if(c == "-"){
                console.log(`Substraction of ${a} and ${b} is ${a-b} .`)
            }
            else if(c == "/"){
                console.log(`division of ${a} and ${b} is ${a/b} .`)
            }
            else if(c == "*"){
                console.log(`Multiplication of ${a} and ${b} is ${a*b} .`)
            }
            else{
                console.log("invalid");
            }
            
        }
        greetUser(num1,num2,operator);
