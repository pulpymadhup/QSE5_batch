<!DOCTYPE html>

<body>
    <script>
        // Write a function to calculate the factorial of a number.
        let num = Number(prompt("Give the number : ", "5"));

        let fact = (a) => {
            let fact = 1
            for(let i = 1 ; i<=a ; i++){
                fact = fact*i;
            }
            console.log(fact);
        }
        fact(num);
    </script>
</body>
