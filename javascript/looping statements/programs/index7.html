 </head>
 <body>
    <!-- factorial of number  -->
     <script>
        let num = Number(prompt("Give the number :"));
        let fact = 1;

        for(let i = num ; i>0 ; i--){
            fact = fact*i
        }
        console.log(fact);
        
     </script>
 </body>
