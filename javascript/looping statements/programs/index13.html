<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // print 3 largest prime number in the range 1-100.

        let largest = 0;
        let secondlargest = 0;
        let thirdlargest = 0;
         for( let num = 1 ; num<=100 ; num++){
            if(num==1) continue ;
            let prime = true; 
            for (let i = 2; i <= parseInt(num/2) ; i++) {
                if (num % i == 0) {
                    prime = false;
                    break;
                }
            }
            if (prime){
                if(num>largest){
                    thirdlargest = secondlargest;
                    secondlargest = largest;
                    largest = num;
                }
            } 
            
        }
        console.log(`largest : ${largest} , second largest: ${secondlargest} and third largest: ${thirdlargest}`)
    </script>
</body>
</html>
