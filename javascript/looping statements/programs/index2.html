<body>
    <!-- Reverse a number -->
    <script>
        let num = 2345;
        let rev = 0;
        while(num>0){
            rev = num%10 +rev*10;
            num = parseInt(num/10);
        }
        console.log(rev);
         
    </script>
</body>
