<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // print alternate prime number in the ranf=ge of 1-50

        let count = 0;

         for( let num = 1 ; num<=50 ; num++){
            if(num==1) continue ;
            let prime = true; 
            for (let i = 2; i <= parseInt(num/2) ; i++) {
                if (num % i == 0) {
                    prime = false;
                    break;
                }
            }
            if (prime){
                count++
                if(count%2==0){
                    console.log(num);
                }
                
            } 
            
        }

    </script>
</body>
</html>
