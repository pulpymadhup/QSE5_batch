<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Smallest digit of a number  -->
     <script>
        let num = Number(prompt("give the number: "));
        let rem = 0;
        let smallest = Infinity;

        while(num>0){
            rem = num%10;
            if(rem<smallest){
                smallest = rem;
            }
            num = parseInt(num/10);
        }
        console.log(smallest);
     </script>
    
</body>
</html>
