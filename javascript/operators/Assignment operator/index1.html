<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- assignmrnt operators ( += , -+ ,*= , /= , %= , **=) -->
    <script>
        let a= 10;
        console.log(a)
        a+=5 ; //15
        console.log(a)
        a-=3 ; //12
        console.log(a)
        a*=2 ; //24
        console.log(a)
        a/=3 ; //8
        console.log(a)
        a%=5 ; //3
        console.log(a)
        a**=2 ; //9
        console.log(a)

    </script>
</body>
</html>
