<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Increment operator
        //    pre increment (++variable)
        let a = 10 ;
        console.log(++a) // 11
        console.log(++a) // 12

        //   post Increment (variable++)
        console.log(a++); // 12
        console.log(a++); //13
        console.log(a); //14

        // Decrement operator
        //   pre decrement  

        console.log(--a); //13
        console.log(--a); // 12

        //   post decrement 

        console.log(a--) // 12
        console.log(a--) // 11
        console.log(a) // 10


        
    </script>
</body>
</html>
