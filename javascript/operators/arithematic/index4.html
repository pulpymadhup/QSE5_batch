<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- division operator -->
    <script>
        console.log(14/3) // 4.66666666667
        console.log(true/6)//0.16666
        console.log(7/null)//Infinity
        console.log(null/8)//0
        console.log(7/undefined)//NaN
        console.log(0/0) //NaN
    </script>
</body>
</html>
