<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- exponential operator  -->
    <script>
        console.log(5 ** 2) // 25
        console.log('helo' ** 2 ) // NaN
        console.log("5" **2) // 25
        console.log(2** 4 ) // 16
        console.log(4 ** true) // 4
        console.log(4 ** false) //1
        console.log(4 ** null) // 1
        console.log(4 ** undefined) // NaN
        console.log(0 ** 0) // 1
        console.log(0 ** 1) // 0 
    </script>
</body>
</html>
