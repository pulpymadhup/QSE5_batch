<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- modulus operator -->
    <script>
        console.log("100"%3) // 1
        console.log("100" % true) //0
        console.log("100" % false) // NaN
        console.log(false % 3) //0
        console.log(3%7) // 3

        console.log(7-4*9/2%7+3 ) // 6
        console.log(4 * 9 / 2 % 7 ) // 4
    </script>
</body>
</html>
